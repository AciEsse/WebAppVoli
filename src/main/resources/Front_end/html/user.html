<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="../style/style_Admin_User.css">
</head>
<body>
    
    <div id="impaginazione">
        
        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
        <div id="d4"></div>
    </div>
    <div id="header">
        <h1 class="titolo">Viaggia con noi in tutto il mondo!</h1>
        <h3 class="titolo-scorrevole">Cosa aspetti scegli il tuo volo, ora!</h3>
        <nav>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-funnel" viewBox="0 0 16 16" onclick="apriFiltro()" id="filtroUser">
        <path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5zm1 .5v1.308l4.372 4.858A.5.5 0 0 1 7 8.5v5.306l2-.666V8.5a.5.5 0 0 1 .128-.334L13.5 3.308V2z"/>
        </svg>
        <form action="" id="formFiltroUser">
        <ul id="filtro" > 
        
         <li class="listafiltro">Partenza:</li> 
          <input type="text" id="filtroPartenza" nome="filtroPartenza" style="border-top: none; border-right: none; margin-left: 1.8rem; background-color: rgba(255, 255, 255, 0.35);" >
          <li class="listafiltro">Destinazione:</li> 
          <input type="text" id="filtroDestinazione" name="filtroDestinazione" style="border-top: none; border-right: none; margin-left: 1.8rem;background-color: rgba(255, 255, 255, 0.35);">
          <li class="listafiltro">Orario partenza:</li> 
          <input type="time" name="filtroOrarioPartenza" id="filtroOrarioPartenza" style="border-top: none; border-right: none; margin-left: 1.8rem; background-color: rgba(255, 255, 255, 0.35);">
          <li class="listafiltro">Orario arrivo:</li> 
          <input type="time" name="filtroOrarioArrivo" id="filtroOrarioArrivo" style="border-top: none; border-right: none; margin-left: 1.8rem; background-color: rgba(255, 255, 255, 0.35);">
          <li class="listafiltro">Data:</li> 
          <input type="time" name="filtroData" id="filtroData" style="border-top: none; border-right: none; margin-left: 1.8rem; background-color: rgba(255, 255, 255, 0.35);">
          <li class="listafiltro">Compagnia:</li> 
          <input type="time" name="filtroCompagnia" id="filtroCompagnia" style="border-top: none; border-right: none; margin-left: 1.8rem; background-color: rgba(255, 255, 255, 0.35);"><br>
          <input type="button" value="Filta">
          </form>

        </ul> 
        </form>
      </nav>
        <div id="icona-login-esterna" onclick="logout()" class="logIconaUser"></div>
    </div>
    <div id="contenuto">
        <div>
            <table id="table">
                <thead>
                    <tr>
                        <th>Codice</th><th>Compagnia</th><th>Partenza</th><th>Destinazione</th>
                        <th>Data</th><th>Decollo</th><th>Atterraggio</th><th>Posti</th>
                    </tr>
                 </thead>
                 <tbody id="bodyVoli"></tbody>
            </table>
        </div>
        <div>
            <fieldset id="fieldset">
                <legend id="legend">Prenota il volo!</legend>
                <form action="" id="form">
                    <label for="postiPrenotati">Inserisci il numero di posti che vuoi prenotare!</label>
                    <input type="text" name="postiPrenotati" id="postiPrenotati"><br>
                    <button type="button" onclick="prenotaVolo()">Prenota Volo</button>
                </form>
            </fieldset>
        </div>
    </div>

    <script src="../Javascript/Admin_User.js"></script>
    
</body>
</html>
